<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="chartBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="chartBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      @keyframes waveFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 110px; y: 190px; }
        50% { height: 140px; y: 160px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 160px; y: 140px; }
        50% { height: 120px; y: 180px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 80px; y: 220px; }
        50% { height: 150px; y: 150px; }
      }
      .wave-line {
        animation: waveFloat 6s ease-in-out infinite;
      }
      .pulse-node {
        animation: pulseLight 3s ease-in-out infinite;
      }
      .bar-anim-1 { animation: barGrow1 5s ease-in-out infinite; }
      .bar-anim-2 { animation: barGrow2 6s ease-in-out infinite; }
      .bar-anim-3 { animation: barGrow3 4.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />

  <!-- Dynamic Background Visualization Graphics (Behind text and separated to the right) -->
  <g opacity="0.85">
    <!-- Ambient Blur Circles -->
    <circle cx="1020" cy="120" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-node" />
    <circle cx="860" cy="220" r="160" fill="#a855f7" opacity="0.1" filter="url(#glow)" class="pulse-node" />

    <!-- Animated Data Chart Bars -->
    <rect x="780" y="190" width="28" height="110" rx="6" fill="url(#chartBar1)" class="bar-anim-1" />
    <rect x="824" y="140" width="28" height="160" rx="6" fill="url(#chartBar2)" class="bar-anim-2" />
    <rect x="868" y="220" width="28" height="80" rx="6" fill="url(#chartBar1)" class="bar-anim-3" />
    <rect x="912" y="160" width="28" height="140" rx="6" fill="url(#chartBar2)" class="bar-anim-1" />
    <rect x="956" y="120" width="28" height="180" rx="6" fill="url(#chartBar1)" class="bar-anim-2" />
    <rect x="1000" y="175" width="28" height="125" rx="6" fill="url(#chartBar2)" class="bar-anim-3" />
    <rect x="1044" y="105" width="28" height="195" rx="6" fill="url(#chartBar1)" class="bar-anim-1" />
    <rect x="1088" y="150" width="28" height="150" rx="6" fill="url(#chartBar2)" class="bar-anim-2" />

    <!-- Trend Curves -->
    <path class="wave-line" d="M 740 230 C 810 180, 870 260, 950 170 C 1020 90, 1070 160, 1140 110" 
          fill="none" stroke="url(#lineGlow)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    <path class="wave-line" d="M 740 230 C 810 180, 870 260, 950 170 C 1020 90, 1070 160, 1140 110" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <!-- Nodes on the line -->
    <circle cx="810" cy="180" r="5" fill="#38bdf8" />
    <circle cx="950" cy="170" r="5" fill="#818cf8" />
    <circle cx="1070" cy="160" r="5" fill="#c084fc" />
    <circle cx="1140" cy="110" r="6" fill="#ec4899" filter="url(#glow)" />
  </g>

  <!-- Foreground Clean Typography & Branding (Guaranteed unobstructed) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 56)">
      <rect width="254" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="28" y="21" class="badge-text">DATA VISUALIZATION ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text">
      Awesome <tspan fill="url(#cyanPurple)">Data Visualization</tspan> 📊
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle-text">
      Curated declarative charting libraries, grammar of graphics &amp; rendering engines.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 235)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="16" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">⚡ WebGL &amp; Canvas</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="125" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="158" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">🎨 SVG &amp; D3 Core</text>

      <!-- Tag 3 -->
      <rect x="279" y="0" width="138" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="295" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">📈 Declarative Grammars</text>

      <!-- Tag 4 -->
      <rect x="429" y="0" width="120" height="32" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="445" y="20" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">⚛️ React &amp; Vue</text>
    </g>
  </g>
</svg>
